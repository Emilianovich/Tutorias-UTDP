<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/logo_utdp-ZUGNBkFF.png" type="image/png">
    <title>Login</title>
  <script type="module" crossorigin src="/assets/index-C534GJhf.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DtabVO0V.css">
</head>
<body>
<div class="fondo-login"></div>

<section class="contenedor-login">
    <div class="panel-izquierdo">
        <div class="logo-UTDP">
            <img src="/assets/logo_utdp-ZUGNBkFF.png" alt="Logo Tutorías UTDP" class="logo-principal">
        </div>
    </div>

    <div class="panel-derecho">
        <form class="login" name="formulario-login" action="" method="post">
            <h1 class="titulo">
                UTDP
                <img src="/assets/logo_utdp-ZUGNBkFF.png" alt="Logo UTDP" class="logo-movil">
            </h1>

            <div class="input-login">
                <label for="correo" class="sr-only">Correo</label>
                <input type="email" name="correo" id="correo" placeholder="Correo">
            </div>

            <div class="input-login">
                <label for="contraseña" class="sr-only">Contraseña</label>
                <input type="password" name="contraseña" id="contraseña" placeholder="Contraseña">
                <img src="/assets/eye_closed-DnOUCY9v.png" alt="ojo password" id="password_image">
            </div>

            <div class="boton">
                <button class="login" type="submit">Iniciar Sesión</button>
                <p class="registrarse">¿No tienes cuenta? <a href="/Registrarse/registrarse.html">Regístrate</a></p>
            </div>

        </form>
    </div>
</section>

</body>
</html>
