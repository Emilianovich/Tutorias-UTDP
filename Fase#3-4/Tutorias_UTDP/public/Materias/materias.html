<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Materias</title>
    <link rel="icon" href="../images/logo_utdp.png">
    <link rel="stylesheet" href="../utilidades/estilos_generales.css">
    <link rel="stylesheet" href="materias.css">
    <script defer src="materias.js"></script>
    <script defer src="../utilidades/utilidades.js"></script>
</head>
<body>
    <header class="header_estilos_generales_pc">
        <picture>
            <img src="../images/logo_utdp.png" alt="Logo de la UTDP" id="logo-utdp">
        </picture>
        <div>
            <h1>Tutorías UTDP</h1>
        </div>
        <picture id="picture-icono-perfil">
            <img src="../images/avatar_perfil.png" alt="Ícono de Perfil" id="icono-perfil" onmouseover="cerrarSesion(this)">
        </picture>
    </header>

    <nav class="nav_estilos_generales_pc">
        <div class="opciones-nav">
            <h2>Inicio</h2>
        </div>
        <div class="opciones-nav nav-selected" id="opcion_nav-seleccionada">
            <h2>Materias</h2>
        </div>
        <div class="opciones-nav">
            <h2>Evaluar</h2>
        </div>
        <div class="opciones-nav">
            <h2>Nosotros</h2>
        </div>
    </nav>

    <main>
        <section>
            <article class="nombre-materias">
                <picture>
                    <img alt="Imagen Cálculo I" src="../images/">
                </picture>
                <h1>Cálculo I</h1>
            </article>
            <article class="nombre-materias">
                <picture>
                    <img alt="Imagen Cálculo II" src="../images/">
                </picture>
                <h1>Cálculo II</h1>
            </article>
            <article class="nombre-materias">
                <picture>
                    <img alt="Imagen Programación I" src="../images/">
                </picture>
                <h1>Programación I</h1>
            </article>
            <article class="nombre-materias">
                <picture>
                    <img alt="Imagen Física I" src="../images/">
                </picture>
                <h1>Física I</h1>
            </article>
            <article class="nombre-materias">
                <picture>
                    <img alt="Imagen Física II" src="../images/">
                </picture>
                <h1>Física II</h1>
            </article>
            <article class="nombre-materias">
                <picture>
                    <img alt="Imange EDO" src="../images/">
                </picture>
                <h1>Ecuaciones Diferenciales Ord.</h1>
            </article>
        </section>
    </main>

    <footer class="footer_estilos_generales_pc">
        <div>
            <p>©Copyright Ingeniería Web 2025</p>
        </div>
        <div>
            <p>Linette   Emiola   Nayim   Eloy</p>
        </div>
    </footer>
</body>
</html>
