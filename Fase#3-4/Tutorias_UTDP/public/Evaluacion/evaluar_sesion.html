<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/logo_utdp.png">
    <link rel="stylesheet" href="../utilidades/estilos_generales.css">
    <link rel="stylesheet" href="evaluar_sesion.css">
    <script defer src="../utilidades/utilidades.js"></script> <!-- si lo usan para hover nav -->
    <title>Evaluar sesión</title>
</head>
<body>
    <!-- HEADER -->
    <header class="header_estilos_generales_pc">
        <picture>
            <img src="../images/logo_utdp.png" alt="Logo de la UTDP" id="logo-utdp">
        </picture>
        <div class="titulo-utdp">
            <h1 id="titulo-pagina">Tutorías UTDP</h1>
        </div>
        <picture id="picture-icono-perfil">
            <img src="../images/avatar_perfil.png" alt="Ícono de Perfil" id="icono-perfil">
        </picture>
    </header>

    <!-- SIN NAV AQUÍ -->

    <main>
        <section class="evaluar-sesion-contenedor">
            <h2>Datos de la sesión:</h2>
            <!-- Estos datos se rellenan con la sesión seleccionada -->
            <h2>Tutor:</h2>
            <h2>Materia:</h2>
            <h2>Fecha: --/--/--</h2>
            <h2>Horario: --:--</h2>
            <h2>Salón: ---</h2>

            <div class="evaluar-rating">
                <label for="rango-puntaje"><h2 id="sinmargen">Evalúe a su tutor:</h2></label>
                <div class="rating-bar">
                    <div class="ponteencol">
                        <span class="estrella">★</span>
                        <input type="range" id="rango-puntaje" min="0" max="5" step="1" value="0">
                    </div>
                    <span id="valor-puntaje">0</span>
                </div>
            </div>

            <button id="btn-enviar-evaluacion">Enviar</button>
        </section>

        <!-- POP-UP reutilizando la estructura global -->
        <!--
        <section id="contenedor-pop-up">
            <article id="pop-up">
                <h1 id="pop-up-mensaje"></h1>
                <img id="pop-up-imagen" src="" alt="">
                <button id="cerrar-pop-up">Cerrar</button>
            </article>
        </section> -->
    </main>

    <footer class="footer_estilos_generales_pc">
        <div id="footer-copyright">
            <p>@Copyright Ingeniería Web 2025</p>
        </div>
        <div>
            <p>Linette   Emiola   Nayim   Eloy</p>
        </div>
    </footer>

    <!-- JS SOLO PARA ESTA PANTALLA -->
    <script>
    const slider = document.getElementById('rango-puntaje');
    const labelValor = document.getElementById('valor-puntaje');
    const btnEnviar = document.getElementById('btn-enviar-evaluacion');
    /*const contPop = document.getElementById('contenedor-pop-up');*/
    /*const popMensaje = document.getElementById('pop-up-mensaje');*/
    /*const popImagen = document.getElementById('pop-up-imagen');*/

    // span donde mostraremos las estrellas (arriba de la barra)
    const spanEstrellas = document.querySelector('.estrella');

    // Función para actualizar número + estrellas
    function actualizarRating() {
        const v = parseInt(slider.value, 10) || 0;

        // número pequeño a la derecha
        labelValor.textContent = v;

        // estrellas arriba de la barra:
        // 0 => vacío, 1..5 => tantas ★ como valor
        if (v <= 0) {
            spanEstrellas.textContent = '-';
        } else {
            const estrellas = '★'.repeat(Math.max(0, Math.min(v, 5)));
            spanEstrellas.textContent = estrellas;
        }
    }

    // Inicial (barra en 0, sin estrellas)
    actualizarRating();

    // Cada vez que muevo la barra
    slider.addEventListener('input', actualizarRating);

    // Mostrar pop-ups según valor
    btnEnviar.addEventListener('click', () => {
        const v = parseInt(slider.value, 10);

        if (isNaN(v) || v < 1 || v > 5) {
            // POPUP 1: puntuación inválida
            popMensaje= 'Por favor, coloque una puntuación entre \n1 y 5';
            popImagen= '../images/error-inscripcion.png'; // popup1
            mostrarPopUpConRedirect(popMensaje, popImagen, 'evaluar.html')
        } else {
            // Aquí iría el envío real al backend

            // POPUP 2: éxito
            popMensaje= 'Evaluación enviada exitosamente';
            popImagen= '../images/exito-inscripcion.png';  // popup2
            mostrarPopUpConRedirect(popMensaje, popImagen, 'evaluar.html')
        }
    });

    btnCerrar.addEventListener('click', () => {
        contPop.classList.remove('mostrar');
    });
</script>
</body>
</html>
