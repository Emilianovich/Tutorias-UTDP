<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logo_utdp.png">
    <script type="module" defer src="/utilidades/utilidades.js"></script>
    <script type="module" defer src="/Perfil/perfil.js"></script>
    <link rel="stylesheet" href="/utilidades/estilos_generales.css">
    <link rel="stylesheet" href="/Perfil/perfil.css">
    <link rel="stylesheet" href="/Perfil/perfil_responsive.css">
    <title>Perfil</title>
</head>

<body id="pagina-perfil">
<header class="header_estilos_generales_pc">
    <picture>
        <img src="/images/logo_utdp.png" alt="Logo de la UTDP" id="logo-utdp">
    </picture>
    <div class="titulo-utdp">
        <h1 id="titulo-pagina">Tutorías UTDP</h1>
    </div>
    <picture id="picture-icono-perfil">
        <img src="/images/logout.png" alt="Icono de Cerrar Sesión" id="icono-cerrar_sesion">
    </picture>
</header>

<nav class="nav_estilos_generales_pc">
    <div class="opciones-nav">
        <h2><a href="/Inicio/inicio.html">Inicio</a></h2>
    </div>
    <div class="opciones-nav">
        <h2><a href="/Materias/materias.html">Materias</a></h2>
    </div>
    <div class="opciones-nav">
        <h2><a href="/Evaluacion/evaluar.html">Evaluar</a></h2>
    </div>
    <div class="opciones-nav">
        <h2><a href="/Nosotros/nosotros.html">Nosotros</a></h2>
    </div>
</nav>

<main>
    <aside class="contenedor_perfil_options">
        <div class="contenedor_img"><img src="/images/avatar_perfil.png" alt="Icono de perfil" class="perfil_icon">
        </div>
        <div class="contenedor_botones_perfil">
            <button class="perfil_buttons activa" id="btndatos">Datos Personales</button>
            <hr>
            <button class="perfil_buttons" id="btnpendientes">Sesiones Pendientes</button>
            <hr>
            <button class="perfil_buttons" id="btnanteriores">Sesiones Anteriores</button>
        </div>
    </aside>
    <section id="datos">
        <div class="contenedor_datos_personales">
            <div class="dato_nombre"><label class="campos_perfil">Nombre: </label><input disabled class="datos_perfil" id="nombre_perfil" autocomplete="off"></div>
            <div class="dato_apellido"><label class="campos_perfil">Apellido: </label><input disabled class="datos_perfil" id="apellido_perfil" autocomplete="off"></div>
            <div class="dato_cedula"><label class="campos_perfil">Cédula: </label><input disabled class="datos_perfil" id="cedula_perfil" autocomplete="off"></div>
            <div class="dato_telefono"><label class="campos_perfil">Teléfono: </label><input disabled class="datos_perfil" id="telefono_perfil" autocomplete="off"></div>
            <div class="dato_facultad"><label class="campos_perfil">Facultad: </label><input disabled class="datos_perfil" id="facultad_perfil" autocomplete="off"></div>
            <div class="dato_correo"><label class="campos_perfil">Correo: </label><input disabled class="datos_perfil" id="correo_perfil" autocomplete="off"></div>
            <div class="dato_contraseña"><label class="campos_perfil">Contraseña: </label><input type="password" disabled class="datos_perfil" id="contraseña_perfil" autocomplete="off">
            </div>
            <div class="contenedor_cambiar_contra"><button id="boton_cambiar_contra">Cambiar contraseña</button></div>
        </div>
    </section>
    <section id="pendientes" class="hide">
        <div id="contenedor_sesiones_pendientes">
        </div>
    </section>
    <section id="anteriores" class="hide">
        <div id="contenedor_sesiones_anteriores">
        </div>
    </section>
</main>

<footer class="footer_estilos_generales_pc">
    <div id="footer-copyright">
        <p>©Copyright Ingeniería Web 2025</p>
    </div>
    <div>
        <p>Linette Emiola Nayim Eloy</p>
    </div>
</footer>
</body>

</html>
