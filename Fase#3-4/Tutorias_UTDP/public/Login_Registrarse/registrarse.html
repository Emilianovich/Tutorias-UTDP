<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../images/logo_utdp.png" type="image/png">
    <title>Registrarse</title>
    <link rel="stylesheet" href="registro.css">
    <link rel="stylesheet" href="registro_responsive.css">
</head>
<body>
    <div class="fondo-registro"></div>

    <form class="contenedor-registro" name="registro" action="registrarse.jsp" method="post">
        <div class="titulo-registro">
            <img src="../images/logo_utdp.png" id="logo-utdp" alt="logo UTDP">
            <h1>Registrarse</h1>
        </div>

        <div class="campo-formulario">
            <input type="text" name="Nombre" placeholder="" id="nombre">
            <label class="labels" for="nombre">Nombre</label>
        </div>

        <div class="campo-formulario">
            <input type="text" name="Apellido" placeholder="" id="apellido">
            <label class="labels" for="apellido">Apellido</label>
        </div>

        <div class="campo-formulario">
            <input type="text" name="Cedula" placeholder="" id="cedula">
            <label class="labels" for="Cedula">Cédula</label>
        </div>

        <div class="campo-formulario">
            <input type="text" name="Correo" placeholder="" id="correo">
            <label class="labels" for="correo">Correo</label>
        </div>

        <div class="campo-formulario">
            <input type="text" name="Telefono" placeholder="" id="telefono">
            <label class="labels" for="telefono">Teléfono</label>
        </div>

        <div class="campo-formulario">
            <select id="facultad" name="cod_facultad">
                <option value="" selected disabled hidden>Seleccione una Facultad</option>
                <option value="FCYT">Facultad de Ciencias y Tecnología</option>
                <option value="FIC">Facultad de Ingeniería Civil</option>
                <option value="FIE">Facultad de Ingeniería Eléctrica</option>
                <option value="FII">Facultad de Ingeniería Industrial</option>
                <option value="FIM">Facultad de Ingeniería Mecánica</option>
                <option value="FISC">Facultad de Ingeniería de Sistemas</option>
            </select>
            <label for="facultad">Facultad</label>
        </div>

        <div class="campo-formulario">
            <input type="text" name="password" placeholder="" id="password">
            <label class="labels" for="password">Contraseña</label>
        </div>

        <button class="botones-login-registro" type="submit" value="submit" id="ultimo-opcion-registro"><a href="login.html" target="_self" style="text-decoration: none;"></a>Crear cuenta</a></button>
</form>
</body>
</html>
